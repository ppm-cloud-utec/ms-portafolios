service: ms-portafolios

frameworkVersion: "3"

provider:
  name: aws
  apiGateway:
    restApiId: ${cf:infra-compartida-${sls:stage}.ApiId}
    restApiRootResourceId: ${cf:infra-compartida-${sls:stage}.ApiRootResourceId}
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  logRetentionInDays: 14
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    DB_HOST: ${cf:infra-compartida-${sls:stage}.RdsEndpoint}
    DB_NAME: ppm_portafolios
    DB_SECRETO: ppm/portafolios/db
    DB_SSLMODE: require
    CORS_ALLOWED_ORIGIN: ${env:PPM_ALLOWED_ORIGIN, '*'}
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"
    - "seed/esquema.sql"

plugins:
  - serverless-python-requirements

custom:
  cors:
    origin: ${env:PPM_ALLOWED_ORIGIN, '*'}
    headers:
      - Content-Type
      - Authorization
    allowCredentials: false
  pythonRequirements:
    dockerizePip: true
    slim: true
    cacheLocation: ./.serverless-cache
  autorizador:
    type: CUSTOM
    authorizerId: ${cf:infra-compartida-${sls:stage}.AutorizadorApiId}

functions:

  health:
    handler: src/handlers/health.manejar
    events:
      - http: { path: "/portafolios/health", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  # ---------- Portafolios ----------
  listarPortafolios:
    handler: src/handlers/portafolios.listar
    description: Portafolios con el resumen de sus proyectos
    events:
      - http: { path: "/portafolios/portafolios", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  obtenerPortafolio:
    handler: src/handlers/portafolios.obtener
    events:
      - http: { path: "/portafolios/portafolios/{id}", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  crearPortafolio:
    handler: src/handlers/portafolios.crear
    events:
      - http: { path: "/portafolios/portafolios", method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  # ---------- Proyectos ----------
  listarProyectos:
    handler: src/handlers/proyectos.listar
    description: Listado filtrable por estado, portafolio, salud y riesgo
    events:
      - http: { path: "/portafolios/proyectos", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  obtenerProyecto:
    handler: src/handlers/proyectos.obtener
    events:
      - http: { path: "/portafolios/proyectos/{id}", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  crearProyecto:
    handler: src/handlers/proyectos.crear
    description: Publica proyecto.creado
    events:
      - http: { path: "/portafolios/proyectos", method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  actualizarProyecto:
    handler: src/handlers/proyectos.actualizar
    description: Publica proyecto.priorizado si cambia la prioridad
    events:
      - http: { path: "/portafolios/proyectos/{id}", method: put, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  # ---------- Admision de demanda ----------
  listarPropuestas:
    handler: src/handlers/propuestas.listar
    description: La bandeja de admision, rankeada por score
    events:
      - http: { path: "/portafolios/propuestas", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  crearPropuesta:
    handler: src/handlers/propuestas.crear
    events:
      - http: { path: "/portafolios/propuestas", method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  aprobarPropuesta:
    handler: src/handlers/propuestas.aprobar
    description: Convierte la propuesta en proyecto y publica proyecto.creado
    events:
      - http: { path: "/portafolios/propuestas/{id}/aprobar", method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  rechazarPropuesta:
    handler: src/handlers/propuestas.rechazar
    events:
      - http: { path: "/portafolios/propuestas/{id}/rechazar", method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  priorizacion:
    handler: src/handlers/propuestas.priorizacion
    description: Ranking mas el consumo de presupuesto de la seleccion
    events:
      - http: { path: "/portafolios/priorizacion", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  publicadorOutbox:
    handler: src/handlers/publicador.manejar
    description: Reintentos cada minuto para eventos SNS pendientes
    timeout: 60
    reservedConcurrency: 1
    events:
      - schedule: rate(1 minute)

  # ---------- Consumidor de eventos (EDA) ----------
  worker:
    handler: src/handlers/worker.manejar
    description: Recalcula avance y salud a partir de los eventos de SQS
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt ColaPortafolios.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
          maximumConcurrency: 2

  aprovisionarTenant:
    handler: src/handlers/aprovisionar.aprovisionar
    name: ms-portafolios-${sls:stage}-aprovisionarTenant
    description: Crea el schema del tenant y aplica el DDL de este servicio
    timeout: 60

  compensarTenant:
    handler: src/handlers/aprovisionar.compensar
    name: ms-portafolios-${sls:stage}-compensarTenant
    description: "Rollback del alta: elimina el schema del tenant"
    timeout: 30

resources:
  Resources:

    ColaPortafolios:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-portafolios-${sls:stage}
        VisibilityTimeout: 360
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaPortafoliosDLQ.Arn
          maxReceiveCount: 3

    ColaPortafoliosDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-portafolios-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    SuscripcionPortafolios:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaPortafolios.Arn
        RawMessageDelivery: false
        FilterPolicy:
          tipo:
            - tarea.creada
            - tarea.completada
            - presupuesto.excedido

    # Sin esta politica SNS no puede escribir en la cola.
    PermisoSnsEnCola:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaPortafolios
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt ColaPortafolios.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}

