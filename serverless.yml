service: ms-portafolios

# Se usa la v3 a proposito: la v4 exige una cuenta de serverless.com y un
# SERVERLESS_ACCESS_KEY para cada deploy. La v3 solo necesita credenciales
# de AWS, que es lo unico que da el Learner Lab.
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  logRetentionInDays: 14
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    DB_HOST: ${cf:infra-compartida-${sls:stage}.RdsEndpoint}
    DB_NAME: ppm_portafolios
    DB_USER: ${ssm:/ppm/portafolios/db-user}
    # El secreto se consulta en runtime, no se almacena en CloudFormation.
    DB_PASSWORD_PARAM: /ppm/portafolios/db-password
    DB_SSLMODE: require
    CORS_ALLOWED_ORIGIN: ${env:PPM_ALLOWED_ORIGIN, '*'}
  # AWS Academy: reutilizamos LabRole (permisos deben verificarse).
  # Fuera del laboratorio, sustituir por un rol de mínimo privilegio por función.
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  # Requiere ssm:GetParameter y sns:Publish, además de permisos VPC si aplica.
  # VPC: configurar con los outputs REALES de infra-compartida si RDS es privado.
  # vpc:
  #   securityGroupIds: [${cf:infra-compartida-${sls:stage}.LambdaSecurityGroupId}]
  #   subnetIds: [${cf:infra-compartida-${sls:stage}.PrivateSubnetA}, ${cf:infra-compartida-${sls:stage}.PrivateSubnetB}]
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"

plugins:
  - serverless-python-requirements

custom:
  cors:
    origin: ${env:PPM_ALLOWED_ORIGIN, '*'}
    headers:
      - Content-Type
      - Authorization
    allowCredentials: false
  pythonRequirements:
    # true, no "non-linux": en Linux "non-linux" NO usa Docker y busca un
    # binario python3.12 local, que no existe (el sistema trae 3.14).
    # Forzar Docker ademas garantiza que psycopg se compile contra Amazon
    # Linux, que es donde corre la Lambda.
    dockerizePip: true
    slim: true
    # Cache propio por repo. El cache global de ~/.cache lo comparten todos
    # los servicios, y si dos despliegues corren a la vez un contenedor lo
    # deja en root:root mientras el otro lo lee -> EACCES.
    cacheLocation: ./.serverless-cache
  autorizador:
    # El authorizer vive en infra-compartida y lo comparten los 6 microservicios
    name: autorizadorCompartido
    type: request
    arn: ${cf:infra-compartida-${sls:stage}.AutorizadorArn}
    resultTtlInSeconds: 300
    identitySource: method.request.header.Authorization

functions:

  health:
    handler: src/handlers/health.manejar
    events:
      - http: { path: "/health", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  # ---------- Portafolios ----------
  listarPortafolios:
    handler: src/handlers/portafolios.listar
    description: Portafolios con el resumen de sus proyectos
    events:
      - http: { path: "/portafolios", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  obtenerPortafolio:
    handler: src/handlers/portafolios.obtener
    events:
      - http: { path: "/portafolios/{id}", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  crearPortafolio:
    handler: src/handlers/portafolios.crear
    events:
      - http: { path: "/portafolios", method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  # ---------- Proyectos ----------
  listarProyectos:
    handler: src/handlers/proyectos.listar
    description: Listado filtrable por estado, portafolio, salud y riesgo
    events:
      - http: { path: "/proyectos", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  obtenerProyecto:
    handler: src/handlers/proyectos.obtener
    events:
      - http: { path: "/proyectos/{id}", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  crearProyecto:
    handler: src/handlers/proyectos.crear
    description: Publica proyecto.creado
    events:
      - http: { path: "/proyectos", method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  actualizarProyecto:
    handler: src/handlers/proyectos.actualizar
    description: Publica proyecto.priorizado si cambia la prioridad
    events:
      - http: { path: "/proyectos/{id}", method: put, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  # ---------- Admision de demanda ----------
  listarPropuestas:
    handler: src/handlers/propuestas.listar
    description: La bandeja de admision, rankeada por score
    events:
      - http: { path: "/propuestas", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  crearPropuesta:
    handler: src/handlers/propuestas.crear
    events:
      - http: { path: "/propuestas", method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  aprobarPropuesta:
    handler: src/handlers/propuestas.aprobar
    description: Convierte la propuesta en proyecto y publica proyecto.creado
    events:
      - http: { path: "/propuestas/{id}/aprobar", method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  rechazarPropuesta:
    handler: src/handlers/propuestas.rechazar
    events:
      - http: { path: "/propuestas/{id}/rechazar", method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  priorizacion:
    handler: src/handlers/propuestas.priorizacion
    description: Ranking mas el consumo de presupuesto de la seleccion
    events:
      - http: { path: "/priorizacion", method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

  # ---------- Reintentos de eventos pendientes (outbox) ----------
  publicadorOutbox:
    handler: src/handlers/publicador.manejar
    description: Reintentos cada minuto para eventos SNS pendientes
    timeout: 60
    reservedConcurrency: 1
    events:
      - schedule: rate(1 minute)

  # ---------- Consumidor de eventos (EDA) ----------
  worker:
    handler: src/handlers/worker.manejar
    description: Recalcula avance y salud a partir de los eventos de SQS
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt ColaPortafolios.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
          maximumConcurrency: 2

resources:
  Resources:

    # Cola propia de este consumidor. Cada microservicio tiene la suya: asi
    # uno caido no afecta a los demas y sus mensajes se acumulan.
    ColaPortafolios:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-portafolios-${sls:stage}
        VisibilityTimeout: 360
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaPortafoliosDLQ.Arn
          maxReceiveCount: 3

    ColaPortafoliosDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-portafolios-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    # Suscripcion al topic compartido CON FILTRO: la cola solo recibe los 3
    # tipos que este worker sabe procesar, no todo el trafico del sistema.
    SuscripcionPortafolios:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaPortafolios.Arn
        RawMessageDelivery: false
        FilterPolicy:
          tipo:
            - tarea.creada
            - tarea.completada
            - presupuesto.excedido

    # Sin esta politica SNS no puede escribir en la cola.
    PermisoSnsEnCola:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaPortafolios
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt ColaPortafolios.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}

    # ---------- CORS en las respuestas de ERROR ----------
    # API Gateway genera los 401/403 ANTES de llegar a la Lambda, y esas
    # respuestas no llevan cabeceras CORS. Desde el navegador un 401 se ve
    # entonces como un error de CORS, no como un 401: el frontend no puede
    # distinguir "tu sesion vencio" de "el servidor no responde".
    Cors401:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: UNAUTHORIZED
        StatusCode: "401"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors403:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: ACCESS_DENIED
        StatusCode: "403"
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors4xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    Cors5xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
